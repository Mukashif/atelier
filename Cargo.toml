[workspace]
members = ["crates/atelier-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Image decoding is painfully slow unoptimised; keep it fast in dev builds too.
[profile.dev.package."*"]
opt-level = 3
